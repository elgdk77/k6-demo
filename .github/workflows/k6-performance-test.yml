name: k6 Performance Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-k6-test:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Login to K6 Cloud
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_CLOUD_STACK: ${{ vars.K6_CLOUD_STACK_SLUG }}
        run: >
          k6 login cloud --token $K6_CLOUD_TOKEN --stack $K6_CLOUD_STACK        

      - name: Run k6 test and send results to k6 Cloud
        run: >
          k6 cloud run
          --local-execution
          --env BASE_URL="${{ vars.BASE_URL }}" 
          ./cloud-test.js

      # - name: Run k6 test
      #   uses: grafana/run-k6-action@v1
